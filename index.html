<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo App</title>
    <link
      href="https://fonts.googleapis.com/css?family=Lato:300,400,700"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <section class="info">
      <img src="./eisenhower-matrix.jpg" alt="eisenhower-matrix" class="info__img"/>
      <a
        class="more_inf info__link"
        href="https://goal-life.com/page/method/matrix-eisenhower"
        >Want more details?</a
      >
    </section>

    <section class="task-list">
      <form class="task-list__form">
        <label for="new-task" class="task-list__lable title">Add Item</label>
        <div class="task-list__wrapper">
          <input id="new-task"class="task task-list__input" type="text">
          <button type="submit" class="button">Add</button>
        </div>
      </form>

      <h3 class="todo-title title">Todo</h3>
      <ul id="incompleteTasks">
        <li>
          <input type="checkbox" />
          <label class="task">Pay Bills</label>
          <input type="text" class="task" />
          <button class="edit">Edit</button>
          <button class="delete">
            <img src="./remove.svg" alt="remove-btn" />
          </button>
        </li>
        <li class="editMode">
          <input type="checkbox" />
          <label class="task">Go Shopping</label>
          <input type="text" value="Go Shopping" class="task" />
          <button class="edit">Save</button>
          <button class="delete">
            <img src="./remove.svg" alt="remove-btn" />
          </button>
        </li>
      </ul>

      <h3 class="completed-title title">Completed</h3>
      <ul id="completed-tasks">
        <li>
          <input type="checkbox" checked />
          <label class="task">See the Doctor</label>
          <input type="text" class="task" />
          <button class="edit">Edit</button>
          <button class="delete">
            <img src="./remove.svg" alt="remove-btn" />
          </button>
        </li>
      </ul>
    </section>

    <script src="app.js"></script>
  </body>
</html>
